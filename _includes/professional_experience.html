<section class="section experience-section"><div class="page-shell">
  <div class="section-heading reveal"><h2>Professional Experience</h2></div>
  <div class="experience-list">
    {% for item in site.data.professional_experience %}
    <article class="experience-item reveal">
      <div class="experience-logo">
        {% if item.image %}<img src="{{ item.image | relative_url }}" alt="{{ item.company }} logo" loading="lazy">{% else %}<span>{{ item.mark }}</span>{% endif %}
      </div>
      <div class="experience-main">
        <h3>{{ item.company }}</h3>
        {% if item.role %}<p class="experience-role">{{ item.role }}</p>{% endif %}
        <p class="experience-description">{{ item.description }}</p>
      </div>
      <div class="experience-meta"><strong>{{ item.period }}</strong><span>{{ item.location }}</span></div>
    </article>
    {% endfor %}
  </div>
</div></section>
