<section class="section section-soft" id="projects"><div class="page-shell">
  <div class="section-heading section-heading-row reveal"><div><h2>Projects</h2></div><a class="text-link" href="{{ site.github_link }}" target="_blank" rel="noopener">View GitHub <i class="fa-solid fa-arrow-right"></i></a></div>
  <div class="project-grid">{% for item in site.data.projects %}<article class="project-card project-{{ item.theme }} reveal"><div class="project-art" aria-hidden="true"><span class="project-symbol"><i class="{{ item.icon }}"></i></span><span class="project-orbit"></span></div><div class="project-body"><p class="project-type">{{ item.type }}</p><h3>{{ item.title }}</h3><p>{{ item.description }}</p><div class="tag-row">{% for tag in item.tags %}<span>{{ tag }}</span>{% endfor %}</div><a href="{{ item.link }}">{{ item.link_label }} <i class="fa-solid fa-arrow-right"></i></a></div></article>{% endfor %}</div>
</div></section>
